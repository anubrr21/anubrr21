verse;animation-duration:74s"><rect x="-64.6" y="-15" width="129.2" height="30" rx="15" fill="#070a12" stroke="#ff2d95" stroke-width="1.6"/><text class="pt" y="5" text-anchor="middle" fill="#ff2d95">scikit-learn</text></g></g><g transform="translate(513.0 66.3)"><g class="pill" style="animation-direction:reverse;animation-duration:74s"><rect x="-43.1" y="-15" width="86.2" height="30" rx="15" fill="#070a12" stroke="#ff2d95" stroke-width="1.6"/><text class="pt" y="5" text-anchor="middle" fill="#ff2d95">MongoDB</text></g></g><g transform="translate(750.2 102.8)"><g class="pill" style="animation-direction:reverse;animation-duration:74s"><rect x="-56.0" y="-15" width="112.0" height="30" rx="15" fill="#070a12" stroke="#ff2d95" stroke-width="1.6"/><text class="pt" y="5" text-anchor="middle" fill="#ff2d95">PostgreSQL</text></g></g><g transform="translate(837.2 326.5)"><g class="pill" style="animation-direction:reverse;animation-duration:74s"><rect x="-38.8" y="-15" width="77.6" height="30" rx="15" fill="#070a12" stroke="#ff2d95" stroke-width="1.6"/><text class="pt" y="5" text-anchor="middle" fill="#ff2d95">Docker</text></g></g></g>
</svg>

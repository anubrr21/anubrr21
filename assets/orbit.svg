<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Technology stack shown as orbits">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<style>

.h{font:800 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff;letter-spacing:-.4px}
.s{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8;letter-spacing:1.5px}
.lg{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
.pt{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.core{font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
.ring{transform-origin:600px 290px;animation:spin 40s linear infinite}
.pill{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.sun{animation:breathe 4s ease-in-out infinite;transform-origin:600px 290px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="558" rx="18" fill="url(#panel)" stroke="#1d2740" stroke-width="1.5"/>
<text class="h" x="46" y="60">My stack, in orbit</text>
<text class="s" x="46" y="86">WHAT I REACH FOR, CLOSEST FIRST</text>
<circle cx="64" cy="164" r="6" fill="#00d4ff"/><text class="lg" x="82" y="169">Languages</text><circle cx="64" cy="198" r="6" fill="#8b5cf6"/><text class="lg" x="82" y="203">Frameworks</text><circle cx="64" cy="232" r="6" fill="#ff2d95"/><text class="lg" x="82" y="237">ML, data and tools</text>
<circle class="sun" cx="600" cy="290" r="46" fill="url(#neon)" filter="url(#glow)"/>
<circle cx="600" cy="290" r="38" fill="#070a12"/>
<text class="core" x="600" y="297" text-anchor="middle">build</text>

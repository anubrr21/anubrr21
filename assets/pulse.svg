<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Weekly contribution pulse and weekday breakdown">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
<style>

.h{font:800 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff;letter-spacing:-.4px}
.s{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8;letter-spacing:1.5px}
.ax{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8}
.pk{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#3dffa2}
.line{fill:none;stroke:url(#neon);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1452;animation:draw 9s ease-out infinite}
.wb{transform-box:fill-box;transform-origin:bottom;animation:grow 9s ease-out infinite}
.dot{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes draw{0%{stroke-dashoffset:1452}28%,100%{stroke-dashoffset:0}}
@keyframes grow{0%{transform:scaleY(.05)}18%,100%{transform:scaleY(1)}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#panel)" stroke="#1d2740" stroke-width="1.5"/>
<text class="h" x="46" y="56">Pulse</text>
<text class="s" x="46" y="82">CONTRIBUTIONS PER WEEK, LAST 12 MONTHS</text>
<text class="s" x="860" y="82">BY WEEKDAY. BUSIEST: WEDNESDAY</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GitHub statistics">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<style>

.num{font:800 38px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.lab{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
.note{font-weight:500;fill:#8d99b8}
.leg{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
.pct{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8}
.mid{font:800 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
.sub{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8;letter-spacing:1.5px}
.arc{fill:none;stroke-width:20;transform:rotate(-90deg);transform-origin:760px 150px;animation:arc 8s ease-in-out infinite}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 8s ease-out infinite}
@keyframes arc{0%,20%,100%{stroke-width:20}10%{stroke-width:27}}
@keyframes fill{0%,14%,100%{transform:scaleX(1)}3%{transform:scaleX(.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#panel)" stroke="#1d2740" stroke-width="1.5"/>
<rect x="36" y="36" width="270" height="100" rx="14" fill="#070a12" stroke="#1d2740" stroke-width="1.5"/><rect x="36" y="58" width="4" height="56" rx="2" fill="#00d4ff"/><text class="num" x="60" y="88" fill="#00d4ff">391</text><text class="lab" x="60" y="114">Contributions <tspan class="note">in the last year</tspan></text><rect x="326" y="36" width="270" height="100" rx="14" fill="#070a12" stroke="#1d2740" stroke-width="1.5"/><rect x="326" y="58" width="4" height="56" rx="2" fill="#8b5cf6"/><text class="num" x="350" y="88" fill="#8b5cf6">20</text><text class="lab" x="350" y="114">Repositories <tspan class="note">public</tspan></text><rect x="36" y="154" width="270" height="100" rx="14" fill="#070a12" stroke="#1d2740" stroke-width="1.5"/><rect x="36" y="176" width="4" height="56" rx="2" fill="#ff2d95"/><text class="num" x="60" y="206" fill="#ff2d95">16</text><text class="lab" x="60" y="232">Longest streak <tspan class="note">days in a row</tspan></text><rect x="326" y="154" width="270" height="100" rx="14" fill="#070a12" stroke="#1d2740" stroke-width="1.5"/><rect x="326" y="176" width="4" height="56" rx="2" fill="#3dffa2"/><text class="num" x="350" y="206" fill="#3dffa2">20</text><text class="lab" x="350" y="232">Best day <tspan class="note">2026-09-26</tspan></text>
<circle cx="760" cy="150" r="88" fill="none" stroke="#1d2740" stroke-width="20" opacity=".5"/>
<circle class="arc" cx="760" cy="150" r="88" stroke="#ff6a3d" stroke-dasharray="197.1 552.9" stroke-dashoffset="-0.0" style="animation-delay:0.00s"/><circle class="arc" cx="760" cy="150" r="88" stroke="#f7df1e" stroke-dasharray="166.5 552.9" stroke-dashoffset="-200.1" style="animation-delay:0.50s"/><circle class="arc" cx="760" cy="150" r="88" stroke="#4b8bbe" stroke-dasharray="86.8 552.9" stroke-dashoffset="-369.6" style="animation-delay:1.00s"/><circle class="arc" cx="760" cy="150" r="88" stroke="#3178c6" stroke-dasharray="42.0 552.9" stroke-dashoffset="-459.5" style="animation-delay:1.50s"/><circle class="arc" cx="760" cy="150" r="88" stroke="#b072ff" stroke-dasharray="32.4 552.9" stroke-dashoffset="-504.5" style="animation-delay:2.00s"/><circle class="arc" cx="760" cy="150" r="88" stroke="#c08bff" stroke-dasharray="10.0 552.9" stroke-dashoffset="-539.9" style="animation-delay:2.50s"/>
<text class="mid" x="760" y="154" text-anchor="middle">8</text>
<text class="sub" x="760" y="176" text-anchor="middle">LANGUAGES</text>
<rect x="900" y="51" width="14" height="14" rx="4" fill="#ff6a3d"/><text class="leg" x="926" y="63">HTML</text><text class="pct" x="1160" y="63" text-anchor="end">36%</text><rect x="1020" y="55" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="55" width="96" height="6" rx="3" fill="#ff6a3d" style="animation-delay:0.00s"/><rect x="900" y="85" width="14" height="14" rx="4" fill="#f7df1e"/><text class="leg" x="926" y="97">JavaScript</text><text class="pct" x="1160" y="97" text-anchor="end">31%</text><rect x="1020" y="89" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="89" width="81" height="6" rx="3" fill="#f7df1e" style="animation-delay:0.15s"/><rect x="900" y="119" width="14" height="14" rx="4" fill="#4b8bbe"/><text class="leg" x="926" y="131">Python</text><text class="pct" x="1160" y="131" text-anchor="end">16%</text><rect x="1020" y="123" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="123" width="43" height="6" rx="3" fill="#4b8bbe" style="animation-delay:0.30s"/><rect x="900" y="153" width="14" height="14" rx="4" fill="#3178c6"/><text class="leg" x="926" y="165">TypeScript</text><text class="pct" x="1160" y="165" text-anchor="end">8%</text><rect x="1020" y="157" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="157" width="22" height="6" rx="3" fill="#3178c6" style="animation-delay:0.45s"/><rect x="900" y="187" width="14" height="14" rx="4" fill="#b072ff"/><text class="leg" x="926" y="199">CSS</text><text class="pct" x="1160" y="199" text-anchor="end">6%</text><rect x="1020" y="191" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="191" width="17" height="6" rx="3" fill="#b072ff" style="animation-delay:0.60s"/><rect x="900" y="221" width="14" height="14" rx="4" fill="#c08bff"/><text class="leg" x="926" y="233">Kotlin</text><text class="pct" x="1160" y="233" text-anchor="end">2%</text><rect x="1020" y="225" width="96" height="6" rx="3" fill="#1d2740"/><rect class="fill" x="1020" y="225" width="6" height="6" rx="3" fill="#c08bff" style="animation-delay:0.75s"/>
</svg>

</style>
<clipPath id="d"><rect x="0" y="5" width="1200" height="4" rx="2"/></clipPath>
<rect x="0" y="5" width="1200" height="4" rx="2" fill="#1d2740"/>
<g clip-path="url(#d)"><g class="run"><rect x="-480" y="5" width="170" height="4" fill="url(#neon)"/><rect x="0" y="5" width="170" height="4" fill="url(#neon)"/><rect x="480" y="5" width="170" height="4" fill="url(#neon)"/><rect x="960" y="5" width="170" height="4" fill="url(#neon)"/><rect x="1440" y="5" width="170" height="4" fill="url(#neon)"/></g></g>
</svg>

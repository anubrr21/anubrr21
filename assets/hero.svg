<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Anubrata Bhattacharyya">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="bone" gradientUnits="userSpaceOnUse" x1="770" y1="384" x2="1110" y2="44"><stop offset="0" stop-color="#00d4ff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient></defs>
<style>

.kicker{font:600 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#00d4ff;letter-spacing:2px}
.name{font:800 66px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff;letter-spacing:-1.5px}
.typed{font:600 25px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:url(#neon)}
.chip{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8d99b8}
.cap{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8;letter-spacing:1.5px}
.slot{opacity:0;animation:slot 15s infinite}
.reveal{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:type 15s steps(34) infinite}
.blob{animation:drift 14s ease-in-out infinite alternate}
.star{fill:#eef2ff;opacity:.15;animation:twinkle 4s ease-in-out infinite}
.shoot{stroke:#eef2ff;stroke-width:2;stroke-linecap:round;opacity:0;animation:shoot 9s ease-in infinite}
.bones line{stroke:url(#bone);stroke-width:3.4;stroke-linecap:round}
.joint{fill:#070a12;stroke:#00d4ff;stroke-width:2.6;animation:pulse 2.6s ease-in-out infinite}
.ring{fill:none;stroke:#3dffa2;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:tap 2.6s ease-out infinite}
.orbit{fill:none;stroke:url(#neon);stroke-width:1.6;stroke-dasharray:3 13;opacity:.75;transform-origin:913px 234px;animation:spin 40s linear infinite}
.orbit2{stroke-dasharray:60 26;opacity:.3;animation-duration:26s;animation-direction:reverse}
.scan{stroke:#00d4ff;stroke-width:2;opacity:.0;animation:scan 5s ease-in-out infinite}
.bar{fill:url(#neon);transform-box:fill-box;transform-origin:center;animation:speak 1.2s ease-in-out infinite}
.hand{animation:float 6s ease-in-out infinite}
.underline{transform-box:fill-box;transform-origin:left;animation:grow 5s ease-in-out infinite alternate}
@keyframes slot{0%{opacity:1}31.8%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes type{0%{transform:scaleX(0)}15.0%{transform:scaleX(1)}33.3%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(90px,-40px)}}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.6}}
@keyframes shoot{0%{opacity:0;transform:translate(-80px,-30px)}3%{opacity:.9}9%{opacity:0;transform:translate(330px,125px)}100%{opacity:0;transform:translate(330px,125px)}}
@keyframes pulse{0%,100%{stroke:#00d4ff}50%{stroke:#ff2d95}}
@keyframes tap{0%{opacity:1;transform:scale(.3)}70%{opacity:0;transform:scale(3.4)}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{opacity:0;transform:translateY(0)}15%{opacity:.7}85%{opacity:.7}100%{opacity:0;transform:translateY(292px)}}
@keyframes speak{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes grow{0%{transform:scaleX(.35)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

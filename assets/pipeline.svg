<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How Hands Free Computer turns gestures and speech into actions">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<style>

.h{font:800 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff;letter-spacing:-.4px}
.s{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d99b8;letter-spacing:1.5px}
.step{font:800 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1px}
.lab{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#panel)" stroke="#1d2740" stroke-width="1.5"/>
<text class="h" x="46" y="56">From a wave or a sentence to an action</text>
<text class="s" x="46" y="82">HOW HANDS FREE COMPUTER WORKS, END TO END</text>
<rect x="46" y="118" width="256" height="78" rx="14" fill="#070a12" stroke="#00d4ff" stroke-width="1.6" opacity="1"/><text class="step" x="66" y="148" fill="#00d4ff">01</text><text class="lab" x="66" y="174">Webcam</text><path d="M302 157.0 H330" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M302 157.0 H330"/></circle><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.80s" repeatCount="indefinite" path="M302 157.0 H330"/></circle><rect x="330" y="118" width="256" height="78" rx="14" fill="#070a12" stroke="#00d4ff" stroke-width="1.6" opacity="0.9"/><text class="step" x="350" y="148" fill="#00d4ff">02</text><text class="lab" x="350" y="174">21 hand landmarks</text><path d="M586 157.0 H614" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.45s" repeatCount="indefinite" path="M586 157.0 H614"/></circle><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.25s" repeatCount="indefinite" path="M586 157.0 H614"/></circle><rect x="614" y="118" width="256" height="78" rx="14" fill="#070a12" stroke="#00d4ff" stroke-width="1.6" opacity="0.9"/><text class="step" x="634" y="148" fill="#00d4ff">03</text><text class="lab" x="634" y="174">Per-finger classifiers</text><path d="M870 157.0 H898" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.90s" repeatCount="indefinite" path="M870 157.0 H898"/></circle><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.70s" repeatCount="indefinite" path="M870 157.0 H898"/></circle><rect x="898" y="118" width="256" height="78" rx="14" fill="#070a12" stroke="#00d4ff" stroke-width="1.6" opacity="1"/><text class="step" x="918" y="148" fill="#00d4ff">04</text><text class="lab" x="918" y="174">Cursor, click, scroll</text><rect x="46" y="246" width="256" height="78" rx="14" fill="#070a12" stroke="#ff2d95" stroke-width="1.6" opacity="1"/><text class="step" x="66" y="276" fill="#ff2d95">01</text><text class="lab" x="66" y="302">Microphone</text><path d="M302 285.0 H330" stroke="#ff2d95" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.30s" repeatCount="indefinite" path="M302 285.0 H330"/></circle><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.10s" repeatCount="indefinite" path="M302 285.0 H330"/></circle><rect x="330" y="246" width="256" height="78" rx="14" fill="#070a12" stroke="#ff2d95" stroke-width="1.6" opacity="0.9"/><text class="step" x="350" y="276" fill="#ff2d95">02</text><text class="lab" x="350" y="302">Speech to text</text><path d="M586 285.0 H614" stroke="#ff2d95" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.75s" repeatCount="indefinite" path="M586 285.0 H614"/></circle><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.55s" repeatCount="indefinite" path="M586 285.0 H614"/></circle><rect x="614" y="246" width="256" height="78" rx="14" fill="#070a12" stroke="#ff2d95" stroke-width="1.6" opacity="0.9"/><text class="step" x="634" y="276" fill="#ff2d95">03</text><text class="lab" x="634" y="302">Command parser</text><path d="M870 285.0 H898" stroke="#ff2d95" stroke-width="2" stroke-dasharray="4 6" opacity=".6" fill="none"/><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.20s" repeatCount="indefinite" path="M870 285.0 H898"/></circle><circle r="5" fill="#ff2d95" filter="url(#glow)"><animateMotion dur="1.6s" begin="2.00s" repeatCount="indefinite" path="M870 285.0 H898"/></circle><rect x="898" y="246" width="256" height="78" rx="14" fill="#070a12" stroke="#ff2d95" stroke-width="1.6" opacity="1"/><text class="step" x="918" y="276" fill="#ff2d95">04</text><text class="lab" x="918" y="302">Apps, music, system</text>
</svg>
